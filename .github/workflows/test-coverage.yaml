# Run testthat + compute code coverage on push
name: Test coverage

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Bioconductor repositories are resolved automatically from DESCRIPTION
      # by setup-r-dependencies.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::BiocManager
            any::testthat
            any::txdbmaker
            any::edgeR
            any::org.Hs.eg.db
          needs: check

      - name: Test coverage
        run: |
          covr::package_coverage(quiet = FALSE)
        shell: Rscript {0}

      # Official Codecov action (v5). For public repositories the upload uses
      # the GitHub App integration when CODECOV_TOKEN is unset (optional);
      # the token is only required for private repos.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
