# Run BiocCheck on the built tarball (the Bioconductor-specific lint).
# Online checks (bioc-devel mailing list subscription, support-site
# registration) are disabled because the maintainer email is registered at
# submission time, not before.
name: BiocCheck

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  bioccheck:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-bioc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::BiocCheck
            any::rcmdcheck
          needs: check

      - name: Build tarball
        run: R CMD build .

      - name: BiocCheck
        run: |
          tarball <- list.files(pattern = "^epiPortrait_.*[.]tar[.]gz$")[1]
          BiocCheck::BiocCheck(tarball, `no-check-bioc-help` = TRUE)
        shell: Rscript {0}
