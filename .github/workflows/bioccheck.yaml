# Run BiocCheck on the built tarball (the Bioconductor-specific lint).
# Online checks (bioc-devel mailing list subscription, support-site
# registration) are disabled because the maintainer email is registered at
# submission time, not before.
name: BiocCheck

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  bioccheck:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies in Bioconductor devel
        run: |
          BiocManager::install(c("BiocCheck", "rcmdcheck", "remotes"),
                               ask = FALSE, update = TRUE)
          remotes::install_deps(dependencies = TRUE, upgrade = "never",
                                repos = BiocManager::repositories())
          print(BiocManager::version())
          print(sessionInfo())
        shell: Rscript {0}

      - name: Build tarball
        run: R CMD build .

      - name: BiocCheck
        run: |
          version <- read.dcf("DESCRIPTION", fields = "Version")[[1]]
          tarball <- paste0("epiPortrait_", version, ".tar.gz")
          stopifnot(file.exists(tarball))
          rcmdcheck::rcmdcheck(tarball, args = c("--no-manual", "--as-cran"),
                               error_on = "warning", check_dir = "check")
          result <- BiocCheck::BiocCheck(tarball, `no-check-bioc-help` = TRUE)
          stopifnot(length(result$error) == 0L,
                    length(result$warning) == 0L)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bioconductor-devel-checks
          path: |
            check
            epiPortrait.BiocCheck
